# 本地 / 开发环境 MinIO（Windows Docker Desktop / Linux 通用）
# 用法见 docs/minio-deploy.md
services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: wj-minio
    # API 9000 · 控制台 9001
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # 控制台外链（浏览器访问地址）；生产改为真实域名
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:9001
    command: server /data --console-address ":9001"
    volumes:
      # Windows Docker Desktop 会把相对路径映射到当前 compose 文件所在目录旁
      - ./minio-data:/data
    # 官方镜像未必带 curl/mc；用进程探活即可
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
